    * {
      font-family: "Roboto", "Inter", sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scrollbar-width:thin;
      letter-spacing: 0.3px;
      scrollbar-color: rgba(114, 114, 114, 0.418) transparent;
      -webkit-tap-highlight-color: transparent;
    }

    /* ========== THEME VARIABLES ========== */
    :root,
    [data-theme="dark"] {
--bg-body: #000000;
    --bg-container: linear-gradient(180deg, #000000, transparent);
    --bg-section: #1f1f1fba;
    --bg-input: #191919;
    --bg-icon: #191919;
    --bg-hover: #ffffff17;
    --text-primary: #e6edf3;
    --text-secondary: white;
    --text-heading: blue;
    --accent: white;
    --accent-soft: blue;
    --border: #30363d;
    --border-soft: rgba(255, 255, 255, 0.08);
    --icon-bg: blue;
    --footer-bg: linear-gradient(0deg, #000000 65%, transparent);
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    --theme-btn-bg: #21262d;
    --theme-btn-active: blue;
    }

    [data-theme="light"] {
      --bg-body: #f0f4f8;
      --bg-container: linear-gradient(180deg, #f0f4f8, transparent);
      --bg-section: #ffffffc4;
      --bg-input: #ffffff;
      --bg-icon: #e8f0fe;
      --bg-hover: #e8f0fe;
      --text-primary: #1a1a2e;
      --text-secondary: #000000;
      --text-heading: blue;
      --accent: blue;
      --accent-soft: blue;
      --border: #dadce0;
      --border-soft: rgba(0, 0, 0, 0.06);
      --icon-bg: blue;
      --footer-bg: linear-gradient(0deg, #f0f4f8 65%, transparent);
      --shadow: 0 4px 18px rgba(26, 115, 232, 0.12);
      --theme-btn-bg: #e8f0fe;
      --theme-btn-active: blue;
    }

    [data-theme="telegram"] {
      --bg-body: #0e1621;
      --bg-container: linear-gradient(180deg, #0e1621, transparent);
      --bg-section: #1c2b39c2;
      --bg-input: #242f3d;
      --bg-icon: #242f3d;
      --bg-hover: #2b5278;
      --text-primary: #f5f5f5;
      --text-secondary: #7d8b99;
      --text-heading: #6ab3f3;
      --accent: #2aabee;
      --accent-soft: #5ac8fa;
      --border: #242f3d;
      --border-soft: rgba(255, 255, 255, 0.06);
      --icon-bg: #2aabee;
      --footer-bg: linear-gradient(0deg, #0e1621 65%, transparent);
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      --theme-btn-bg: #242f3d;
      --theme-btn-active: #2aabee;
    }

    body {
      background: var(--bg-body);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 0;
      transition: background 0.3s ease, color 0.3s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      position: sticky;
      top: 0;
      z-index: 10000;
      padding: 15px 10px 0;
      background: linear-gradient(180deg, var(--bg-body), transparent);
    }

    /* Theme switcher */
    .themeoptions {
    display: flex;
    justify-content: center;
    height: 40px;
    width: fit-content;
    padding: 0 10px;
    gap: 12px;
    background: var(--bg-section);
    box-shadow: inset 0.7px 0.7px 0px 0px #ffffff17, inset -0.7px -0.7px 0px 0px #ffffff17;
    filter: drop-shadow(0px 0px 6px #0000002b);
    backdrop-filter: blur(2px);
    border-radius: 999px;
    }

    .themeoptions button {
      border: none;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    outline: none;
    background: transparent;
    color: var(--text-secondary);
    }

    .themeoptions button:hover {
      transform: scale(1.08);
      color: var(--accent);
      border-color: var(--accent);
    }

    .themeoptions button.active {
     color: var(--theme-btn-active);
    }

    /* Search box */
    .search-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .search-icon {
     display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg-section);
    border: none;
    border-radius: 999px;
    height: 40px;
    flex-shrink: 0;
    backdrop-filter: blur(2px);
    cursor: pointer;
    box-shadow: 0.5px 0.5px 0.5px 0 #00000026, -0.5px -0.5px 0.5px 0 #00000026;
    transition: background 0.2s;
    box-shadow: inset 0.7px 0.7px 0px 0px #ffffff17, inset -0.7px -0.7px 0px 0px #ffffff17;
    filter: drop-shadow(0px 0px 6px #0000002b);
    padding: 12px;
    font-weight: 400;
    font-size: 17px;
    }
    svg {
    width: 24px;
    height: 24px;
    fill: var(--text-secondary);
}

    .inputsection {
flex: 1;
    padding: 0 6px 0 14px;
    border-radius: 999px;
    border: none;
    height: 47px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(3px);
    transition: all 0.2s;
    background: var(--bg-section);
    box-shadow: #171717;
    filter: drop-shadow(0px 0px 6px #0000002b);
    }

    .searcharea {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .searcharea svg {
      width: 25px;
    height: 25px;
      fill: var(--text-secondary);
      flex-shrink: 0;
    }

    input#searchInput {
      background: transparent;
    border: none;
    font-size: 18px;
    color: var(--text-primary);
    outline: none;
    width: 100%;
    letter-spacing: 0;
    }

    .clear-btn {
      background: transparent;
      color: var(--text-primary);
      border-radius: 50%;
      padding: 6px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .clear-btn:hover {
      color: var(--accent);
    }

    .clear-btn svg {
          width: 28px;
    height: 28px;
    fill: var(--text-secondary);
    }

    /* Sections */
    #sectionsContainer {
margin-top: 10px;
    width: 99%;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    margin-bottom: 35px;
    }

    .section {
    overflow: hidden;
    }

    .section h2 {
      font-size: 14px;
      font-weight: 600;display: none;
      color: var(--text-heading);
      padding: 14px 16px 8px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .site-item {
      display: flex;
      align-items: center;
      padding: 8px;
      color: var(--text-primary);
      text-decoration: none;border-radius: 15px;
      transition: background 0.18s;
    }
    .site-item:first-child:hover{
         background: var(--bg-hover);
    }

    .letter-icon {
    width: 48px;
    height: 48px;
    margin-right: 10px;
    border-radius: 50%;
    color: #fff;
    font-weight: 500;
    font-size: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    text-transform: uppercase;
    background: var(--icon-bg);
    }

    .site-info {
      flex: 1;

    }

    .site-info h3 {
      font-size: 17px;
      font-weight: 500;
      margin: 0 0 2px;
      color: var(--text-primary);
    }

    .site-info p {
      font-size: 12.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 400;
      max-width: 90%;
    }

    .no-results {
      text-align: center;
      padding: 70px 20px;
      color: var(--text-secondary);

    footer {

      color: var(--text-secondary);
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 0 10px;
      background: var(--footer-bg);
      z-index: 50;
      pointer-events: none;
    }

    group.sites.forEach(site => {
      const a = document.createElement("a");
      a.href = site.url;
      a.target = "_parent";
      a.className = "site-item";

      const initial = getInitial(site.name);

      a.innerHTML = `
        <div class="letter-icon">${initial}</div>
        <div class="site-info">
          <h3>${site.name}</h3>
          <p>${site.desc}</p>
        </div>
      `;

      section.appendChild(a);
    });

    container.appendChild(section);
  });
}

function renderFiltered(query = "") {
  const q = query.toLowerCase().trim();
  const container = document.getElementById("sectionsContainer");
  const noResults = document.getElementById("noResults");

  container.innerHTML = "";

  if (!q) {
    renderAll();
    noResults.style.display = "none";
    return;
  }

  let found = false;

  siteGroups.forEach(group => {
    const matches = group.sites.filter(s =>
      s.name.toLowerCase().includes(q) ||
      s.desc.toLowerCase().includes(q) ||
      s.url.toLowerCase().includes(q)
    );

    if (!matches.length) return;

    found = true;

    const section = document.createElement("div");
    section.className = "section";

    const h2 = document.createElement("h2");
    h2.textContent = group.heading;
    section.appendChild(h2);

    matches.forEach(site => {
      const a = document.createElement("a");
      a.href = site.url;
      a.target = "_parent";
      a.className = "site-item";

      const initial = getInitial(site.name);

      a.innerHTML = `
        <div class="letter-icon">${initial}</div>
        <div class="site-info">
          <h3>${site.name}</h3>
          <p>${site.desc}</p>
        </div>
      `;

      section.appendChild(a);
    });

    container.appendChild(section);
  });

  noResults.style.display = found ? "none" : "block";
}

function goBack() {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    alert("Back button clicked!\n\n(In a real app this would take you to previous screen or home.)");
  }
}

function clearSearch() {
  const input = document.getElementById("searchInput");
  input.value = "";
  renderFiltered("");
  input.focus();
}
function setTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("bsmfi-theme", theme);
  document.querySelectorAll(".themeoptions button").forEach(btn => {
    btn.classList.remove("active");
  });
  const activeBtn = document.getElementById("btn-" + theme);
  if (activeBtn) activeBtn.classList.add("active");
}
(function initTheme() {
  const saved = localStorage.getItem("bsmfi-theme") || "dark";
  setTheme(saved);
})();

renderAll();

document.getElementById("searchInput").addEventListener("input", e => {
  renderFiltered(e.target.value);
});
</script>
</body>
</html>
