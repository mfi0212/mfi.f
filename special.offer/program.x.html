outline: 1px solid #888; } input::placeholder { color: #777; } .btn { width: 100%; padding: 11px; border-radius: 999px; font-size: 16px; font-weight: 500; cursor: pointer; transition: 0.2s; background: #a3a3a345; box-shadow: inset 0 0.8px 0 #ffffff1f; border: 1px solid #ffffff0d; backdrop-filter: blur(2px); color: white; } .btn:active { transform: scale(0.98); } .btn:disabled { opacity: 0.4; cursor: not-allowed; } .btn-success { background: #005200; margin-top: 12px; } .btn-issue { background: #a10000; margin-top: 10px; } .btn-primary { background: #005fffbf; } .result { margin-top: 18px; padding: 12px 15px; border-radius: 20px; text-align: left; font-weight: 500; display: none; line-height: 1.6; font-size: 14px; } .success { background: #002f00; color: #55d655; border: 1px solid #175617; } .error { color: #ff5252; text-align: center; margin: 5px; } .info { background: #3b372d; color: #d5c8a8; border: 1px solid #5c543d; } .ended { background: #2a2a2a; color: #999; border: 1px solid #444; } /* COUNTDOWN */ .timer-card { background: #ffffff17; border-radius: 25px; padding: 17px; margin-bottom: 22px; } .timer-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 17px; } .timer-heading h3 { font-size: 14px; font-weight: 500; } .timer-status { font-size: 11px; color: #55d875; background: #16432355; padding: 5px 10px; border-radius: 30px; } .timer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; } .timer-unit { background: #ffffff12; border-radius: 14px; padding: 13px 3px; } .timer-unit strong { display: block; font-size: 25px; font-weight: 600; font-variant-numeric: tabular-nums; } .timer-unit span { display: block; font-size: 10px; color: #888; margin-top: 5px; text-transform: uppercase; } .progress-info { display: flex; justify-content: space-between; font-size: 11px; color: #999; margin-top: 20px; margin-bottom: 9px; } .progress-track { height: 7px; width: 100%; background: #ffffff1a; border-radius: 30px; overflow: hidden; } .progress-fill { width: 0%; height: 100%; border-radius: 30px; background: linear-gradient(90deg, #0000ff, #ffffff); transition: width 0.8s ease; } .timer-ended { color: #ff6262; background: #45171755; } .offer-box { margin-top: 18px; text-align: center; display: none; } .offer-box img { max-width: 100%; border-radius: 15px; } .eligible-note { font-size: 0.88rem; color: #aaa; margin: 12px 0 6px; font-style: italic; } .issue-box { display: none; margin-top: 16px; padding: 14px; background: #2a2a2a; border-radius: 12px; border: 1px solid #555; text-align: left; font-size: 0.9rem; color: #ccc; } .issue-box textarea { width: 100%; height: 80px; margin-top: 8px; padding: 10px; border-radius: 6px; border: 1px solid #555; background: #ffffff17; color: #eee; resize: vertical; } .issue-box button { margin-top: 10px; padding: 8px 18px; } @media(max-width:350px) { .timer-unit strong { font-size: 20px; } } </style> </head> <body> <div class="card"> <div class="header"> <button class="go-back" onclick="goBack()"> <svg viewBox="0 0 24 24" height="24" width="24" fill="white"> <path d="M9.18 12l7.53 7.53q.3.3.29.7t-.31.7T16 21.23l-.7-.3-7.67-7.65q-.27-.27-.4-.61T7.09 12t.13-.67.4-.61l7.67-7.67q.3-.3.71-.29t.71.31.3.7-.3.7L9.18 12z"/> </svg> </button> <h1>ProgramX</h1> <button class="go-back" onclick="showIssueForm()"> <svg viewBox="0 0 24 24" height="24" width="24" fill="white"> <path d="M12 16.71q.34 0 .58-.23t.23-.57-.23-.57T12 15.1t-.58.23-.23.57.23.57.23.57zM12.53 13.01q.22-.22.22-.53V7.94q0-.32-.22-.53T12 7.19t-.53.22-.22.53v4.54q0 .32.22.53t.53.22.53-.22zM9.21 20.5q-.37 0-.7-.14t-.58-.39l-3.9-3.9q-.25-.25-.39-.58t-.14-.7V9.21q0-.37.14-.7t.39-.58l3.9-3.9q.25-.25.58-.39t.7-.14h5.58q.37 0 .7.14t.58.39l3.91 3.91q.25.25.39.58t.14.7v5.58q0 .37-.14.7t-.39.58l-3.91 3.91q-.25.25-.58.39t-.7.14H9.21z"/> </svg> </button> </div> <div class="content"> <p>OFFER START AND ENDS</p> <div class="dates"> <div><strong>Starts:</strong> <span id="startDateDisplay"></span></div> <div><strong>Ends:</strong> <span id="endDateDisplay"></span></div> </div> <!-- LIVE COUNTDOWN --> <div class="timer-card" id="timerCard"> <div class="timer-heading"> <h3>Offer countdown</h3> <span class="timer-status" id="timerStatus">LIVE</span> </div> <div class="timer-grid" id="timerGrid"> <div class="timer-unit"> <strong id="days">00</strong> <span>Days</span> </div> <div class="timer-unit"> <strong id="hours">00</strong> <span>Hours</span> </div> <div class="timer-unit"> <strong id="minutes">00</strong> <span>Minutes</span> </div> <div class="timer-unit"> <strong id="seconds">00</strong> <span>Seconds</span> </div> </div> <div class="progress-info"> <span id="progressLabel">Offer progress</span> <span id="progressPercent">0%</span> </div> <div class="progress-track"> <div class="progress-fill" id="progressFill"></div> </div> </div> <div class="paswordverify"> <label for="password">Password</label> <input type="password" id="password" placeholder="Enter here..." autocomplete="off"> </div> <button class="btn btn-primary" id="verifyBtn" onclick="checkEligibility()"> Verify eligibility </button> <div id="result" class="result"></div> <div id="offerBox" class="offer-box"> <img src="offer.png" alt="Special Offer"> <p class="eligible-note"> This offer is strictly for eligible members only. </p> <button class="btn btn-success" onclick="applyOffer()"> Apply Now </button> <button class="btn btn-issue" onclick="showIssueForm()"> Can't Apply? Report Issue </button> <div id="issueBox" class="issue-box"> <strong>Facing problem while applying?</strong> <p style="margin-top:6px;font-size:0.85rem;color:#aaa;"> Describe the issue you are facing. Our support team will help you. </p> <textarea id="issueText" placeholder="Describe your issue here..."></textarea> <button class="btn btn-primary" onclick="submitIssue()"> Submit Issue </button> </div> </div> </div> </div>
<script>

const CORRECT_PASSWORD = "]v+C_x";

const OFFER_START = new Date("2026-11-25T11:30:00+05:30");
const OFFER_END   = new Date("2026-11-26T22:00:00+05:30");

const APPLY_URL = "https://forms.gle/NGHx7TJLW8m5KPQd6";
const ISSUE_URL = "https://forms.gle/nbLS2uJXTB5dDbkp6";

let offerVerified = false;

function formatDate(date) {
    return date.toLocaleDateString("en-IN", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}

document.getElementById("startDateDisplay").textContent =
    formatDate(OFFER_START);

document.getElementById("endDateDisplay").textContent =
    formatDate(OFFER_END);


// LIVE TIMER AND PROGRESS BAR

function updateTimer() {

    const now = new Date();

    const totalDuration = OFFER_END - OFFER_START;
    const elapsed = now - OFFER_START;

    let progress = totalDuration > 0
        ? (elapsed / totalDuration) * 100
        : 100;

    progress = Math.max(0, Math.min(100, progress));

    document.getElementById("progressFill").style.width =
        progress + "%";

    document.getElementById("progressPercent").textContent =
        progress.toFixed(1) + "%";

    // Before offer starts
    if (now < OFFER_START) {

        const remaining = OFFER_START - now;

        setCountdown(remaining);

        document.getElementById("timerStatus").textContent = "UPCOMING";
        document.getElementById("progressLabel").textContent = "Offer starts in";

        document.getElementById("timerStatus").style.color = "#e6c46a";

        document.getElementById("verifyBtn").disabled = true;

        return;
    }
    document.addEventListener('contextmenu', e => e.preventDefault());
 document.addEventListener("gesturestart", e => e.preventDefault());
    if (now >= OFFER_END) {

        setCountdown(0);

        document.getElementById("timerStatus").textContent = "ENDED";
        document.getElementById("timerStatus").classList.add("timer-ended");

        document.getElementById("timerStatus").style.color = "#ff6262";

        document.getElementById("progressLabel").textContent = "Offer completed";

        document.getElementById("progressPercent").textContent = "100%";

        document.getElementById("progressFill").style.width = "100%";

        document.getElementById("verifyBtn").disabled = true;

        document.getElementById("password").disabled = true;

        document.getElementById("password").placeholder = "Offer closed";

        document.getElementById("offerBox").style.display = "none";

        const resultBox = document.getElementById("result");

        resultBox.className = "result ended";
        resultBox.style.display = "block";

        resultBox.innerHTML =
            "<strong>Offer has ended.</strong><br>The application period is now closed.";

        offerVerified = false;

        return;
    }

    // Active offer
    const remaining = OFFER_END - now;

    setCountdown(remaining);

    document.getElementById("timerStatus").textContent = "LIVE";
    document.getElementById("timerStatus").classList.remove("timer-ended");

    document.getElementById("timerStatus").style.color = "#55d875";

    document.getElementById("progressLabel").textContent = "Offer progress";

    document.getElementById("verifyBtn").disabled = false;

    document.getElementById("password").disabled = false;
}

function setCountdown(milliseconds) {

    const secondsTotal = Math.max(0, Math.floor(milliseconds / 1000));

    const days = Math.floor(secondsTotal / 86400);
    const hours = Math.floor((secondsTotal % 86400) / 3600);
    const minutes = Math.floor((secondsTotal % 3600) / 60);
    const seconds = secondsTotal % 60;

    document.getElementById("days").textContent =
        String(days).padStart(2, "0");

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
}

updateTimer();
setInterval(updateTimer, 1000);


// ELIGIBILITY VERIFICATION

function checkEligibility() {

    const password = document.getElementById("password").value.trim();

    const resultBox = document.getElementById("result");
    const offerBox = document.getElementById("offerBox");

    const now = new Date();

    resultBox.className = "result";
    resultBox.style.display = "block";

    offerBox.style.display = "none";
    offerVerified = false;

    if (now < OFFER_START) {

        resultBox.classList.add("info");

        resultBox.innerHTML =
            `Offer has not started yet.<br>
            Starts on <strong>${formatDate(OFFER_START)}</strong>`;

        return;
    }

    if (now >= OFFER_END) {

        resultBox.classList.add("ended");

        resultBox.innerHTML =
            "<strong>Offer has ended.</strong><br>Applications are closed.";

        return;
    }

    if (password === "") {

        resultBox.classList.add("error");
        resultBox.textContent = "Enter the password.";

        return;
    }

    if (password === CORRECT_PASSWORD) {

        offerVerified = true;

        resultBox.classList.add("success");

        resultBox.innerHTML =
            "Verified! Click Apply Now to claim the offer.";

        offerBox.style.display = "block";

    } else {

        resultBox.classList.add("error");

        resultBox.innerHTML =
            "Incorrect password.<br>You are not eligible for this offer.";
    }
}


// APPLY OFFER

function applyOffer() {

    if (!offerVerified || new Date() >= OFFER_END) {
        alert("This offer is no longer available.");
        updateTimer();
        return;
    }

    window.location.href = APPLY_URL;
}


// ISSUE FORM

function showIssueForm() {

    window.location.href = ISSUE_URL;
}

function submitIssue() {

    const text = document.getElementById("issueText").value.trim();

    if (text === "") {
        alert("Describe your issue before submitting.");
        return;
    }

    alert("Your issue has been submitted successfully.\nOur support team will get back to you shortly.");

    document.getElementById("issueText").value = "";

    document.getElementById("issueBox").style.display = "none";
}


// ENTER KEY SUPPORT

document.getElementById("password").addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
        checkEligibility();
    }

});


// BACK BUTTON

function goBack() {

    if (window.history.length > 1) {
        window.history.back();
    } else {
        alert("No previous page available.");
    }

}

</script>

</body>
</html>
