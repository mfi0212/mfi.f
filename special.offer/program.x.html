e-between; align-items: center; } input[type="password"] { padding: 10px; border: none; border-radius: 999px; font-size: 16px; background: #ffffff1f; color: #eee; width: fit-content; } input[type="password"]:focus { outline: none; border-color: #888; } input[type="password"]::placeholder { color: #777; } .btn { width: 100%; padding: 11px; border-radius: 999px; font-size: 18px; font-weight: 500; cursor: pointer; transition: all 0.2s; background: #a3a3a345; box-shadow: inset -0.8px 0px 0px #0000001c, inset 0px 0.8px 0px #ffffff1f, inset 0.8px 0px 0px #0000001c, inset 0px -0.8px 0px #ffffff1f; border: solid 0.2px #0000000d; backdrop-filter: blur(2px); color: white; } .btn-success { background: #005200; color: #fff; margin-top: 12px; } .btn-issue { background: #a10000; color: #fff; margin-top: 10px; } .result { margin-top: 18px; padding: 10px 15px; border-radius: 20px; text-align: left; font-weight: 500; display: none; line-height: 1.5; } .btn-primary { background: #005fffbf; } .success { background: #002f00; color: green; box-shadow: inset -0.8px 0px 0px #0000001c, inset 0px 0.8px 0px #ffffff1f, inset 0.8px 0px 0px #0000001c, inset 0px -0.8px 0px #ffffff1f; } .error { color: red; text-align: center; margin: 5px; } .info { background: #3b372d; color: #d5c8a8; border: 1px solid #5c543d; } .ended { background: #2a2a2a; color: #999; border: 1px solid #444; } .offer-box { margin-top: 18px; text-align: center; display: none; } .offer-box img { max-width: 100%; border-radius: 15px; border: none; } .eligible-note { font-size: 0.88rem; color: #aaa; margin: 12px 0 6px; font-style: italic; } .matter { font-size: 0.9rem; color: #bbb; margin-top: 10px; line-height: 1.5; } .issue-box { display: none; margin-top: 16px; padding: 14px; background: #2a2a2a; border-radius: 8px; border: 1px solid #555; text-align: left; font-size: 0.9rem; color: #ccc; } .issue-box textarea { width: 100%; height: 80px; margin-top: 8px; padding: 10px; border-radius: 6px; border: 1px solid #555; background: #ffffff17; color: #eee; resize: vertical; } .issue-box button { margin-top: 10px; width: auto; padding: 8px 18px; font-size: 0.9rem; } .content { padding: 10px; } </style> </head> <body> <div class="card"> <div class="header"> <button class="go-back" onclick="goBack()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#FFFFFF"><path d="M9.18,12l7.53,7.53q0.3,0.3 0.29,0.7t-0.31,0.7T16,21.23t-0.7-0.3L7.63,13.28q-0.27-0.27-0.4-0.61T7.09,12t0.13-0.67t0.4-0.61L15.3,3.05q0.3-0.3 0.71-0.29t0.71,0.31t0.3,0.7t-0.3,0.7L9.18,12Z"/></svg></button> <h1>ProgramX</h1> <button class="go-back" onclick="showIssueForm()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#FFFFFF"><path d="M12,16.71q0.34,0 0.58-0.23t0.23-0.57t-0.23-0.57T12,15.1t-0.58,0.23T11.19,15.9t0.23,0.57T12,16.71Zm0.53-3.7q0.22-0.22 0.22-0.53V7.94q0-0.32-0.22-0.53T12,7.19T11.47,7.41T11.25,7.94v4.54q0,0.32 0.22,0.53T12,13.23t0.53-0.22ZM9.21,20.5q-0.37,0-0.7-0.14T7.93,19.97L4.03,16.07q-0.25-0.25-0.39-0.58T3.5,14.79V9.21q0-0.37 0.14-0.7T4.03,7.93L7.93,4.03Q8.18,3.78 8.51,3.64T9.21,3.5h5.58q0.37,0 0.7,0.14t0.58,0.39l3.91,3.91q0.25,0.25 0.39,0.58t0.14,0.7v5.58q0,0.37-0.14,0.7t-0.39,0.58l-3.91,3.91q-0.25,0.25-0.58,0.39t-0.7,0.14H9.21ZM9.1,19h5.8L19,14.9V9.1L14.9,5H9.1L5,9.1v5.8L9.1,19ZM12,12Z"/></svg></button> </div> <div class="content"> <p>OFFER START AND ENDS</p> <div class="dates"> <div><strong></strong> <span id="startDateDisplay"></span></div> <div><strong></strong> <span id="endDateDisplay"></span></div> </div> <div class="paswordverify"> <label for="password">Password</label> <input type="password" id="password" placeholder="Enter here..." autocomplete="off"> </div> <button class="btn btn-primary" onclick="checkEligibility()">Verify eligibility</button> <div id="result" class="result"></div> <!-- Offer shown only after successful verification --> <div id="offerBox" class="offer-box"> <img src="offer.png" alt="Special Offer"> <p class="eligible-note">This offer is strictly for eligible members only.</p> <button class="btn btn-success" onclick="applyOffer()">Apply Now</button> <button class="btn btn-issue" onclick="showIssueForm()">Can't Apply? Report Issue</button> <div id="issueBox" class="issue-box"> <strong>Facing problem while applying?</strong> <p style="margin-top:6px; font-size:0.85rem; color:#aaa;"> Describe the issue you are facing. Our support team will help you. </p> <textarea id="issueText" placeholder="Describe your issue here..."></textarea> <button class="btn btn-primary" onclick="submitIssue()">Submit Issue</button> </div> </div> </div> </div>
<script>
    const CORRECT_PASSWORD = "]v+C_x";
const OFFER_START = new Date("2026-11-24T11:30:00");
const OFFER_END   = new Date("2026-11-27T20:30:00");
    document.addEventListener('contextmenu', e => e.preventDefault());
    function formatDate(date) {
      return date.toLocaleDateString("en-IN", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    document.getElementById("startDateDisplay").textContent = formatDate(OFFER_START);
    document.getElementById("endDateDisplay").textContent = formatDate(OFFER_END);

    function checkEligibility() {
      const password = document.getElementById("password").value.trim();
      const resultBox = document.getElementById("result");
      const offerBox = document.getElementById("offerBox");
      const issueBox = document.getElementById("issueBox");
      const now = new Date();

      resultBox.className = "result";
      resultBox.style.display = "block";
      offerBox.style.display = "none";
      issueBox.style.display = "none";

      // Offer not started
      if (now < OFFER_START) {
        resultBox.classList.add("info");
        resultBox.innerHTML = `Offer has not started yet.<br>Starts on <strong>${formatDate(OFFER_START)}</strong>`;
        return;
      }

      // Offer ended
      if (now > OFFER_END) {
        resultBox.classList.add("ended");
        resultBox.innerHTML = `<strong>Offer has ended</strong><br>The offer closed on <strong>${formatDate(OFFER_END)}</strong>`;
        return;
      }

      // Empty password
      if (password === "") {
        resultBox.classList.add("error");
        resultBox.textContent = "Enter the password.";
        return;
      }

      // Correct password
      if (password === CORRECT_PASSWORD) {
        resultBox.classList.add("success");
        resultBox.innerHTML = `
          Verified..! click Apply Now to claim the offer.<br>
        `;
        offerBox.style.display = "block";
      } else {
        resultBox.classList.add("error");
        resultBox.innerHTML = `Incorrect password.<br>You are not eligible for this offer.`;
      }
    }

    function applyOffer() {
      alert("We are redirecting you to form");
      window.open('https://forms.gle/NGHx7TJLW8m5KPQd6','_self')
    }

    function showIssueForm() {
      alert("We are redirecting you to form");
      window.open('https://forms.gle/nbLS2uJXTB5dDbkp6','_self')
    }

    function submitIssue() {
      const text = document.getElementById("issueText").value.trim();
      if (text === "") {
        alert("Describe your issue before submitting.");
        return;
      }
      alert("Your issue has been submitted successfully.\nOur support team will get back to you shortly.");
      document.getElementById("issueText").value = "";
      document.getElementById("issueBox").style.display = "none";
    }

    // Enter key support
    document.getElementById("password").addEventListener("keypress", function(e) {
      if (e.key === "Enter") checkEligibility();
    });
        function goBack() {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    alert("Back button clicked!\n\n(In a real app this would take you to previous screen or home.)");
  }
}
  </script>
